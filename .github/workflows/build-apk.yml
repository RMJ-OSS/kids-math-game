name: Build Kids Math APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            openjdk-17-jdk zip unzip git wget \
            build-essential ccache libffi-dev libssl-dev \
            libsqlite3-dev libbz2-dev libgdbm-dev \
            libreadline-dev liblzma-dev zlib1g-dev

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: ${{ runner.os }}-buildozer-

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.37

      - name: Download + rename Vosk Chinese model
        run: |
          wget https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip -O model.zip
          unzip -q model.zip
          mv vosk-model-small-cn-0.22 model-zh
          ls model-zh/ | head

      - name: Build APK (debug)
        env:
          URL_freetype: https://download-mirror.savannah.gnu.org/releases/freetype/freetype-{version}.tar.gz
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kids-math-game-apk
          path: |
            bin/*.apk
            build.log
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure
          path: build.log
          retention-days: 7
